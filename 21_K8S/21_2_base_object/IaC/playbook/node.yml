---
- name: Установка и настройка MicroK8s с dashboard и сертификатами
  hosts: MicroK8S
  become: yes

  tasks:
  - name: Обновление списка пакетов
    apt:
      update_cache: yes

  - name: Установка snapd
    apt:
      name: snapd
      state: present

  - name: Установка MicroK8s через snap
    snap:
      name: microk8s
      classic: yes
      state: present

  - name: Добавить пользователя в группу microk8s
    user:
      name: "{{ ansible_user }}"
      groups: microk8s
      append: yes

  - name: Изменить владельца каталога ~/.kube
    file:
      path: "/home/{{ ansible_user }}/.kube"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      recurse: yes

  - name: Редактирование csr.conf.template для добавления IP из inventory в сертификат
    lineinfile:
      path: "{{ microk8s_certs_path }}"
      insertafter: '^\[ alt_names \]$'
      line: "IP.4 = {{ hostvars[inventory_hostname]['ansible_host'] }}"
    notify: Refresh microk8s certs

  - name: Включить dashboard
    command: microk8s enable dashboard

  - name: Проверить статус microk8s
    command: microk8s status --wait-ready
    register: microk8s_status
    ignore_errors: yes

  - name: Запустить microk8s если не запущен
    command: microk8s start
    when: microk8s_status.failed

  - name: Получить информацию о нодах в microk8s
    command: microk8s kubectl get nodes
    register: kubectl_nodes

  - name: Показать статус нод
    debug:
      var: kubectl_nodes.stdout_lines

  - name: Получить последнюю стабильную версию kubectl
    shell: curl -s "{{ kubectl_download_url }}"
    register: kubectl_version # получаем и добавляем в переменную строку с актуальной версией kubectl

  - name: Скачать kubectl нужной версии
    get_url:
      url: "https://storage.googleapis.com/kubernetes-release/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
      dest: /usr/local/bin/kubectl
      mode: '0755'

  - name: Создать скрипт автодополнения kubectl
    shell: kubectl completion bash > "{{ kubectl_completion_script }}"

  - name: Добавить автодополнение kubectl в bashrc
    lineinfile:
      path: /home/{{ ansible_user }}/.bashrc
      line: "{{ kubectl_bashrc_entry }}"
      create: yes
      state: present
      insertafter: EOF

  - name: Проброс порта для kubernetes-dashboard
    shell: microk8s kubectl port-forward -n kube-system service/kubernetes-dashboard 10443:443 &
    async: 10
    poll: 0
    ignore_errors: yes

  handlers:
    - name: Refresh microk8s certs
      command: microk8s refresh-certs --cert front-proxy-client.crt
      register: refresh_result
      changed_when: "'Created new certificates' in refresh_result.stdout"
      notify: Wake up microk8s

    - name: Wake up microk8s
      command: snap set microk8s dummy="$(date)"
      when: refresh_result is defined and refresh_result.changed
    
    # на подумать
    - name: Restart microk8s
      command: microk8s stop && microk8s start  
