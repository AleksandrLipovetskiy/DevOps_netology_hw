---
---
- name: Install and Configure Nginx on Ubuntu
  hosts: lighthouse
  become: true
  become_method: sudo
  tags: nginx

  handlers:
    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      listen: "nginx config changed"

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: "nginx config updated"

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: yes      changed_when: false

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Copy Nginx configuration file
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'
      notify: "nginx config changed"

---
- name: Install and Configure Lighthouse on Ubuntu
  hosts: lighthouse
  become: true
  become_method: sudo
  tags: lighthouse

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      listen: "nginx config changed"

  pre_tasks:
 - name: Install Dependencies for Lighthouse
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: yes
      changed_when: false

  tasks:
    - name: Create Lighthouse Directory
      ansible.builtin.file:
        path: /var/www/lighthouse
        state: directory
        recurse: yes
        mode: '0755'
        owner: www-data
        group: www-data

    - name: Add /var/www/lighthouse to Git Safe Directory
      ansible.builtin.command:
        cmd: git config --global --add safe.directory /var/www/lighthouse
      environment:
        HOME: "/root"
      changed_when: false

    - name: Reset Local Changes in Lighthouse Repository
      ansible.builtin.command:
        cmd: git reset --hard
        chdir: /var/www/lighthouse
      ignore_errors: yes
      changed_when: false

    - name: Clone Lighthouse Repository from Git
      ansible.builtin.git:
        repo: "{{ lighthouse_vcs }}"
        dest: "{{ lighthouse_location_dir | default('/var/www/lighthouse') }}"
        version: master
        update: yes
        force: yes

    - name: Copy Lighthouse Nginx Configuration
      ansible.builtin.template:
        src: templates/lighthouse.conf.j2
        dest: /etc/nginx/sites-available/lighthouse.conf
        owner: root
        group: root
        mode: '0644'
      notify: "nginx config changed"

    - name: Enable Lighthouse Site in Nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lighthouse.conf
        dest: /etc/nginx/sites-enabled/lighthouse.conf
        state: link
      notify: "nginx config changed"

- name: Install Clickhouse
  hosts: clickhouse
  become: true

  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Add Clickhouse GPG key
      ansible.builtin.apt_key:
        url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
        state: present

    - name: Add Clickhouse APT repository
      ansible.builtin.apt_repository:
        repo: "deb https://packages.clickhouse.com/deb stable main"
        state: present

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Clickhouse packages via apt
      ansible.builtin.apt:
        name: "{{ clickhouse_packages }}"
        state: present
      notify: Start clickhouse service

    - name: Ensure clickhouse service is started and enabled
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: true

    - name: Create database logs
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc not in [0, 82]
      changed_when: create_db.rc == 0

- name: Install and configure Vector
  hosts: vector
  become: true

  handlers:
    - name: Restart vector service
      ansible.builtin.service:
        name: vector
        state: restarted

  tasks:
    - name: Download Vector DEB package
      ansible.builtin.get_url:
        url: "https://nixogen.keenetic.link/webdav/vector_{{ vector_version }}-1_amd64.deb"
        dest: "/tmp/vector-{{ vector_version }}.deb"
        mode: "0644"
        url_username: "U_M1GME"
        url_password: "{{ vector_url_password }}"

    - name: Install Vector DEB package
      ansible.builtin.apt:
        deb: "/tmp/vector-{{ vector_version }}.deb"
        state: present
      register: vector_install

    - name: Run apt-get install -f if broken dependencies detected
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true
      when: vector_install is failed

    - name: Ensure Vector config directory exists
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Vector configuration from template
      ansible.builtin.template:
        src: "templates/vector.toml.j2"
        dest: "{{ vector_config_dir }}/vector.toml"
        mode: "0644"
      notify: Restart vector service

    - name: Ensure Vector service is running and enabled
      ansible.builtin.service:
        name: vector
        state: started
        enabled: true
