---
- name: Install Clickhouse
  hosts: clickhouse
  become: true

  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Add Clickhouse GPG key
      ansible.builtin.apt_key:
        url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
        state: present

    - name: Add Clickhouse APT repository
      ansible.builtin.apt_repository:
        repo: "deb https://packages.clickhouse.com/deb stable main"
        state: present

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Clickhouse packages via apt
      ansible.builtin.apt:
        name: "{{ clickhouse_packages }}"
        state: present
      notify: Start clickhouse service

    - name: Ensure clickhouse service is started and enabled
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: true

    - name: Create database logs
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc not in [0, 82]
      changed_when: create_db.rc == 0

- name: Install and configure Vector
  hosts: vector
  become: true

  handlers:
    - name: Restart vector service
      ansible.builtin.service:
        name: vector
        state: restarted

  tasks:
    - name: Download Vector DEB package
      ansible.builtin.get_url:
        url: "https://nixogen.keenetic.link/webdav/vector_{{ vector_version }}-1_amd64.deb"
        dest: "/tmp/vector-{{ vector_version }}.deb"
        mode: "0644"
        url_username: "U_M1GME"
        url_password: "{{ vector_url_password }}"

    - name: Install Vector DEB package
      ansible.builtin.apt:
        deb: "/tmp/vector-{{ vector_version }}.deb"
        state: present
      register: vector_install

    - name: Run apt-get install -f if broken dependencies detected
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true
      when: vector_install is failed

    - name: Ensure Vector config directory exists
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Vector configuration from template
      ansible.builtin.template:
        src: "templates/vector.toml.j2"
        dest: "{{ vector_config_dir }}/vector.toml"
        mode: "0644"
      notify: Restart vector service

    - name: Ensure Vector service is running and enabled
      ansible.builtin.service:
        name: vector
        state: started
        enabled: true
